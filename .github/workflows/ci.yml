name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  dprint-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test -p dprint-plugin-json-schema-sort
      - run: cargo clippy -p dprint-plugin-json-schema-sort --target wasm32-unknown-unknown --features wasm -- -D warnings
      - run: cargo build -p dprint-plugin-json-schema-sort --target wasm32-unknown-unknown --release --features wasm
