name: Release

on:
  push:
    tags:
      - v[0-9]+.*

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Fails if the tag version does not match Cargo.toml version.
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    # create-release fails on tag/Cargo.toml version mismatch, so gating on
    # it prevents publishing a crate version that disagrees with the tag.
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for crates.io Trusted Publishing
    environment:
      name: crates-io
      url: ${{ steps.crate.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Build the versioned crates.io URL from Cargo.toml (name + version).
      - id: crate
        run: |
          url=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0] | "https://crates.io/crates/\(.name)/\(.version)"')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Trusted Publishing by default. Set repo variable TRUSTED=false to fall
      # back to the CARGO_REGISTRY_TOKEN secret (e.g. for the first publish,
      # before a trusted publisher exists on crates.io).
      - id: auth
        if: vars.TRUSTED != 'false'
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ case(vars.TRUSTED != 'false', steps.auth.outputs.token, secrets.CARGO_REGISTRY_TOKEN) }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: json-schema-sort
          target: ${{ matrix.target }}
          # Archive name `<bin>-<target>.<ext>` matches the binstall
          # pkg-url template in Cargo.toml. tar.gz on unix, zip on windows.
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
