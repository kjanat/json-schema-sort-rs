[package]
name         = "json-schema-sort"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Deterministic, schema-aware sorting for JSON Schema files"
readme       = "README.md"
repository   = "https://github.com/kjanat/json-schema-sort-rs"
license      = "Apache-2.0 OR MIT"
keywords     = ["formatter", "json", "schema", "sort"]
categories   = ["command-line-utilities", "development-tools"]
include      = ["/Cargo.toml", "/LICENSE*", "/README.md", "/src", "/tests"]

# cargo-binstall: fetch prebuilt binaries from GitHub Releases.
# Artifact layout matches taiki-e/upload-rust-binary-action defaults
# (binary at archive root, `<bin>-<target>.tar.gz`, zip on Windows).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name              = "json-schema-sort"
path              = "src/main.rs"
required-features = ["cli"]

[dependencies]
[dependencies.clap]
version  = "4"
features = ["derive"]
optional = true

[dependencies.glob]
version  = "0.3"
optional = true

[dependencies.serde_json]
version  = "1"
features = ["preserve_order"]

[features]
default = ["cli"]
cli     = ["dep:clap", "dep:glob"]

# Smaller release binaries for binstall downloads. Unwinding kept (no abort).
[profile.release]
strip = true
lto   = true
